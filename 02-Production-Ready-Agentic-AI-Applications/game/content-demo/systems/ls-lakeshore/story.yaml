# Demo story text. Nothing here affects a score.
briefs:
  development:
    from: demo-priya
    title: Build the grant report system
    text: >-
      The grant office approved our project. Build me the system that writes the **monthly
      grant report**: put workers on the map, give each one what it may read, and join them to
      the report. Actions cost money and time. Validate as you go. *We will live with this
      system for a long time.*
  planning:
    from: demo-priya
    title: The grant pays for one project
    text: >-
      The district grant pays for **one** large project at our branch. The staff have six
      requests. Sort them for me, and keep the big project for the one that truly needs it.

letters:
  development_reveal:
    from: demo-priya
    always: >-
      The trial months are done. The report needs the branch inboxes for the missing numbers, a
      model that decides with a clear goal, and the grant officer checking rather than writing.
    variants:
      empty: You never validated a map, so there is no system to run. Validate early next time.
      rough: Your map writes the plain months. The silent branches still sink the report.
      steady: A map that works most months. Look at the facts it lost on the way.
      strong: A sound system, with the strong model where the judgment is.
      outstanding: The grant office will not send this one back.
  planning_reveal:
    from: demo-priya
    always: >-
      The grant project goes to the grant reports, which pull numbers from many systems and chase
      what is missing. The room bookings need a rule, and the bus needs a better timetable.
    variants:
      empty: You sent me an almost empty board. Next time, sort what you can, even if you are unsure.
      rough: Your board took the complaints at their word. Look again at the counts.
      steady: Part of your board holds up. Check the problems you gave more than they needed.
      strong: A sound board, with the big project where it belongs.
      outstanding: Exactly the board I hoped for.

dialogue:
  - id: ls-d-dev-start
    speaker: demo-tom
    text: The developers have cleared their desks.
    trigger: {phase: development, on: start}
  - id: ls-d-dev-read
    speaker: demo-mara
    text: Seven returned reports. That is a lot of red ink.
    trigger: {phase: development, on: insight:ls-a-read}
  - id: ls-d-dev-result
    speaker: demo-idris
    text: The first number is always the hardest.
    trigger: {phase: development, on: run_result}
  - id: ls-d-dev-reveal
    speaker: demo-priya
    text: Now we know what it takes.
    trigger: {phase: development, on: reveal}
  - id: ls-d-start
    speaker: demo-tom
    text: The printer works, by the way. Just saying.
    trigger: {phase: planning, on: start}
  - id: ls-d-reveal
    speaker: demo-priya
    text: Let us get the grant reports off our desks.
    trigger: {phase: planning, on: reveal}

banter:
  - id: ls-b-coffee
    lines:
      - {speaker: demo-mara, text: Who moved the good mug?}
      - {speaker: demo-tom, text: It was evidence. I needed it for a test.}
  - id: ls-b-printer
    lines:
      - {speaker: demo-idris, text: The printer says it is out of cyan.}
      - {speaker: demo-tom, text: We only print in black.}
      - {speaker: demo-idris, text: That is what makes it so sad.}
  - id: ls-b-story
    lines:
      - {speaker: demo-sami, text: Who left the big chair by the door again?}
      - {speaker: demo-priya, text: Story time. The dragon needed a throne.}
