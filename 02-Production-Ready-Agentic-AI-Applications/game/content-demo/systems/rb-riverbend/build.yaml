  traps:
    - id: rb-trap-chain
      kind: overbuilt
      map:
        tiles:
          - {id: t1, kind: rb-w-agent, col: 1, row: 1, model: rb-m-small, runs_on: rb-c-api, prompt: rb-p-line}
          - {id: t2, kind: rb-w-agent, col: 2, row: 1, model: rb-m-small, runs_on: rb-c-api, prompt: rb-p-line}
          - {id: t3, kind: rb-w-agent, col: 3, row: 1, model: rb-m-small, runs_on: rb-c-api, prompt: rb-p-line}
          - {id: t4, kind: rb-w-agent, col: 4, row: 1, model: rb-m-small, runs_on: rb-c-api, prompt: rb-p-line}
        lines:
          - {from: rb-s-form, to: t1}
          - {from: rb-s-catalog, to: t2}
          - {from: rb-s-forum, to: t3}
          - {from: rb-s-courier, to: t4}
          - {from: t1, to: t2}
          - {from: t2, to: t3}
          - {from: t3, to: t4}
          - {from: t4, to: rb-result}
      why_tempting: Four agents look like four times the work done.
      why_it_fails: Every handoff loses a little, and no small agent judges well.
    - id: rb-trap-rule
      kind: underbuilt
      map:
        tiles:
          - {id: t1, kind: rb-w-rule, col: 2, row: 2}
        lines:
          - {from: rb-s-form, to: t1}
          - {from: rb-s-catalog, to: t1}
          - {from: t1, to: rb-result}
      why_tempting: A rule is free and never wrong on the plain case.
      why_it_fails: Most requests are not the plain case.
  # What a host reads beside a player's map: for a kind of worker, its best use and the wrong
  # choices. Never sent to a player.
  guide:
    rb-w-agent:
      best: One agent that reads the four places a request can be answered from, with a person behind it.
      wrong: The forum as a fifth source, or an agent for every source.
    rb-w-librarian:
      best: Last before the answer goes out, checking what the agent prepared.
      wrong: Reading every source herself. She has minutes for a check and not for the search.
